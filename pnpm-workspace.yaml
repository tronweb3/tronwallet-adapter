packages:
    - 'packages/*/*'
    - 'packages/adapters/evm/*'
    - '!packages/deprecated/**'
    - 'demos/*/*'
    - 'demos/dev-demo'
    - 'demos/cdn-demo'
strictPeerDependencies: false
saveWorkspaceProtocol: false
linkWorkspacePackages: true
allowBuilds:
    '@reown/appkit': true
    bufferutil: true
    core-js: true
    esbuild: true
    keccak: true
    msw: true
    sharp: true
    utf-8-validate: true
